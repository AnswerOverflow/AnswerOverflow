name: answeroverflow-discord-bot

services:
  discord-bot:
    build:
      context: ../../..
      dockerfile: apps/discord-bot/Dockerfile
    image: answeroverflow-discord-bot:current
    env_file: /etc/answeroverflow/discord-bot.env
    restart: unless-stopped
    mem_limit: ${BOT_MEMORY_LIMIT:?set by deploy.sh}
    stop_grace_period: 30s
    init: true
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "5"
